databases:
  - name: oracle-db
    plan: free
    databaseName: wc2026
    user: oracle

services:
  - type: web
    name: oracle-mondial-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oracle-db
          property: connectionString
      - key: ODDS_API_KEY
        sync: false
      - key: FOOTBALL_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
